name: CI

on:
  push:
    branches: [ "main", "develop", "feature/implementacao-testes" ]
  pull_request:
    branches: [ "main", "develop", "feature/implementacao-testes" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: maven

      - name: Permission for mvnw
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw clean verify
